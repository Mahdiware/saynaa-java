name: Build Android APK (Java + NDK)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.caching=true
        -Dorg.gradle.parallel=true
        -Dorg.gradle.configureondemand=true
        -Dkotlin.incremental=true

      ANDROID_API: "34"
      BUILD_TOOLS_VERSION: "34.0.0"
      NDK_VERSION: "26.1.10909125"
      CMAKE_VERSION: "3.22.1"

    steps:
      # CHECKOUT
      - name: Checkout code
        uses: actions/checkout@v4

      # JAVA
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ANDROID SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # GRADLE
      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      # ANDROID SDK CACHE
      - name: Cache Android SDK components
        uses: actions/cache@v4
        id: cache-android
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/platforms
            ${{ env.ANDROID_SDK_ROOT }}/platform-tools
            ${{ env.ANDROID_SDK_ROOT }}/build-tools
            ${{ env.ANDROID_SDK_ROOT }}/ndk
            ${{ env.ANDROID_SDK_ROOT }}/cmake
            ${{ env.ANDROID_SDK_ROOT }}/cmdline-tools
            ${{ env.ANDROID_SDK_ROOT }}/licenses
          key: ${{ runner.os }}-android-sdk-${{ env.ANDROID_API }}-${{ env.BUILD_TOOLS_VERSION }}-${{ env.NDK_VERSION }}-${{ env.CMAKE_VERSION }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-

      # INSTALL ANDROID SDK COMPONENTS
      - name: Install Android SDK components
        if: steps.cache-android.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -eux

          echo "Android SDK root:"
          echo "$ANDROID_SDK_ROOT"

          echo "Looking for sdkmanager..."

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi

          if [ -z "${SDKMANAGER:-}" ]; then
            echo "ERROR: sdkmanager not found"
            echo
            echo "Android SDK:"
            ls -la "$ANDROID_SDK_ROOT" || true
            echo
            echo "Command line tools:"
            find "$ANDROID_SDK_ROOT/cmdline-tools" \
              -maxdepth 3 \
              -type f \
              -name sdkmanager \
              -print 2>/dev/null || true
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "platform-tools" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

          yes | "$SDKMANAGER" --licenses || true

      # SHOW INSTALLED SDK
      - name: Show installed SDK/NDK
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "ANDROID SDK"
          echo "=========================================="

          echo "SDK root:"
          echo "$ANDROID_SDK_ROOT"

          echo
          echo "Installed SDK directories:"
          ls -la "$ANDROID_SDK_ROOT" || true

          echo
          echo "Platforms:"
          ls -la "$ANDROID_SDK_ROOT/platforms" || true

          echo
          echo "Build tools:"
          ls -la "$ANDROID_SDK_ROOT/build-tools" || true

          echo
          echo "Platform tools:"
          ls -la "$ANDROID_SDK_ROOT/platform-tools" || true

          echo
          echo "NDK:"
          ls -la "$ANDROID_SDK_ROOT/ndk" || true

          echo
          echo "CMake:"
          ls -la "$ANDROID_SDK_ROOT/cmake" || true

      # CLEAN
      - name: Clean project
        run: ./gradlew clean --no-daemon

      # DEBUG BUILD
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # VERIFY DEBUG APK
      - name: Verify debug APK
        shell: bash
        run: |
          set -eux

          echo "Debug APK:"

          find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            -print

      # UPLOAD DEBUG APK
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # RELEASE BUILD
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # VERIFY RELEASE APK
      - name: Verify release APK
        shell: bash
        run: |
          set -eux

          echo "Release APK:"

          find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print

      # UPLOAD RELEASE APK
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # GITHUB RELEASE
      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build #${{ github.run_number }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}